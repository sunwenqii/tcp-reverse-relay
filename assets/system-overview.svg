<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img"
     aria-labelledby="title description">
    <title id="title">TCP Reverse Relay 系统结构</title>
    <desc id="description">外部设备访问公网服务端的映射端口，服务端经客户端将 TCP
        流量送到本机服务。客户端主动连接服务端握手端口，并负责重连。
    </desc>
    <defs>
        <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#f8fbff"/>
            <stop offset="1" stop-color="#eef5f7"/>
        </linearGradient>
        <linearGradient id="server" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#165a70"/>
            <stop offset="1" stop-color="#0b3448"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
            <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#163b53" flood-opacity=".10"/>
        </filter>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
            <path d="M1 1 8 4.5 1 8" fill="none" stroke="#217f8c" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </marker>
        <marker id="controlArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
            <path d="M1 1 8 4.5 1 8" fill="none" stroke="#da9146" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </marker>
        <style>text{font-family:Inter,'Noto Sans CJK SC','Microsoft
            YaHei',sans-serif}.title{fill:#142b3d;font-size:27px;font-weight:750}.subtitle{fill:#6e8393;font-size:14px}.card-title{font-size:20px;font-weight:750}.card-line{font-size:14px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px}.pill{font-size:12px;font-weight:700}
        </style>
    </defs>
    <rect width="1200" height="488" rx="22" fill="url(#background)"/>
    <path d="M40 112H1160" stroke="#dde8ee"/>
    <text x="42" y="57" class="title">一次 TCP 请求如何到达内网服务</text>
    <text x="42" y="86" class="subtitle">服务端开放公网端口，客户端主动连接并将数据转发到本机目标</text>
    <rect x="1040" y="43" width="118" height="28" rx="14" fill="#e1f3ef"/>
    <text x="1099" y="62" text-anchor="middle" class="pill" fill="#187767">示例端口</text>

    <g filter="url(#shadow)">
        <rect x="42" y="157" width="238" height="180" rx="17" fill="#fff"/>
        <rect x="336" y="157" width="238" height="180" rx="17" fill="url(#server)"/>
        <rect x="630" y="157" width="238" height="180" rx="17" fill="#fff"/>
        <rect x="924" y="157" width="238" height="180" rx="17" fill="#fff"/>
    </g>
    <rect x="62" y="177" width="39" height="39" rx="10" fill="#e6f1fa"/>
    <path d="M70 194h23m-18-7h13m-13 14h13" stroke="#478bbb" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="248" class="eyebrow" fill="#70a0c2">01 / REQUEST</text>
    <text x="62" y="277" class="card-title" fill="#173246">外部设备</text>
    <text x="62" y="301" class="card-line" fill="#4c6a7c">访问公网 IP:18080</text>
    <text x="62" y="323" font-size="12" fill="#8da0ae">发起 TCP 连接</text>
    <rect x="356" y="177" width="39" height="39" rx="10" fill="#ffffff2b"/>
    <path d="M367 188h17v17h-17zm4 5h9m-9 5h9" fill="none" stroke="#7de0d3" stroke-width="2" stroke-linecap="round"/>
    <text x="356" y="248" class="eyebrow" fill="#90d4d5">02 / PUBLIC SERVER</text>
    <text x="356" y="277" class="card-title" fill="#fff">公网服务端</text>
    <text x="356" y="301" class="card-line" fill="#e0f3f2">监听映射端口 18080</text>
    <text x="356" y="323" font-size="12" fill="#a9ccce">接收请求并通知客户端</text>
    <rect x="650" y="177" width="39" height="39" rx="10" fill="#e5f6f1"/>
    <path d="M660 190l8 7-8 7m11-14l8 7-8 7" fill="none" stroke="#319c8a" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round"/>
    <text x="650" y="248" class="eyebrow" fill="#55a99d">03 / PRIVATE CLIENT</text>
    <text x="650" y="277" class="card-title" fill="#173246">内网客户端</text>
    <text x="650" y="301" class="card-line" fill="#4c6a7c">主动连接服务端</text>
    <text x="650" y="323" font-size="12" fill="#8da0ae">控制连接断开后持续重试</text>
    <rect x="944" y="177" width="39" height="39" rx="10" fill="#f4ecfb"/>
    <circle cx="963" cy="196" r="10" fill="none" stroke="#9976bd" stroke-width="2"/>
    <path d="M958 196h10m-5-5v10" stroke="#9976bd" stroke-width="2" stroke-linecap="round"/>
    <text x="944" y="248" class="eyebrow" fill="#a489c2">04 / LOCAL SERVICE</text>
    <text x="944" y="277" class="card-title" fill="#173246">本地服务</text>
    <text x="944" y="301" class="card-line" fill="#4c6a7c">127.0.0.1:8080</text>
    <text x="944" y="323" font-size="12" fill="#8da0ae">HTTP 或其他 TCP 服务</text>

    <path d="M287 247H327" fill="none" stroke="#217f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M581 247H621" fill="none" stroke="#217f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M875 247H915" fill="none" stroke="#217f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M749 344V367H455V344" fill="none" stroke="#da9146" stroke-width="2.5" stroke-dasharray="6 5"
          marker-end="url(#controlArrow)"/>
    <rect x="397" y="384" width="408" height="54" rx="13" fill="#fff" stroke="#dce8ed"/>
    <text x="601" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#a96c2f">客户端主动连接握手端口
        10010
    </text>
    <text x="601" y="428" text-anchor="middle" font-size="11" fill="#7a91a0">心跳维持控制连接 · 断线后重新注册</text>
    <text x="600" y="463" text-anchor="middle" font-size="12" fill="#6f8795">TCP 数据双向转发；图中端口仅为示例</text>
</svg>
