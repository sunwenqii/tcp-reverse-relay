<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description">
  <title id="title">TCP Reverse Relay 转发结构</title>
  <desc id="description">外部设备通过公网服务端访问内网客户端的本机服务，数据双向转发。客户端主动连接服务端的握手端口，并维持控制连接。图中端口仅为示例。</desc>
  <defs>
    <marker id="data-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="control-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#2459c5" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .heading { fill: #1f2937; font-size: 16px; font-weight: 600; }
      .label { fill: #1f2937; font-size: 16px; font-weight: 600; }
      .detail { fill: #667085; font-size: 13px; }
      .note { fill: #667085; font-size: 12px; }
      .node { fill: #fff; stroke: #9ca3af; stroke-width: 1; }
      .data { fill: none; stroke: #6b7280; stroke-width: 1.4; marker-start: url(#data-arrow); marker-end: url(#data-arrow); }
    </style>
  </defs>
  <rect width="1120" height="340" fill="#fff"/>
  <text x="32" y="32" class="heading">TCP 转发结构</text>
  <text x="1088" y="32" text-anchor="end" class="note">端口仅为示例</text>

  <rect x="584" y="60" width="520" height="152" rx="4" fill="none" stroke="#cbd0d7" stroke-dasharray="5 4"/>
  <text x="604" y="83" class="note">客户端所在机器（内网）</text>

  <rect x="32" y="110" width="190" height="84" rx="4" class="node"/>
  <text x="127" y="143" text-anchor="middle" class="label">外部设备</text>
  <text x="127" y="168" text-anchor="middle" class="detail">访问 服务器IP:18080</text>

  <rect x="300" y="110" width="210" height="84" rx="4" class="node"/>
  <text x="405" y="143" text-anchor="middle" class="label">公网服务端</text>
  <text x="405" y="168" text-anchor="middle" class="detail">监听映射端口 18080</text>

  <rect x="606" y="110" width="190" height="84" rx="4" class="node"/>
  <text x="701" y="143" text-anchor="middle" class="label">转发客户端</text>
  <text x="701" y="168" text-anchor="middle" class="detail">连接并转发数据</text>

  <rect x="876" y="110" width="210" height="84" rx="4" class="node"/>
  <text x="981" y="143" text-anchor="middle" class="label">本机服务</text>
  <text x="981" y="168" text-anchor="middle" class="detail">127.0.0.1:8080</text>

  <path d="M234 152H288" class="data"/>
  <path d="M522 152H594" class="data"/>
  <path d="M808 152H864" class="data"/>

  <path d="M701 194V246H405V199" fill="none" stroke="#2459c5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#control-arrow)"/>
  <text x="553" y="274" text-anchor="middle" fill="#2459c5" font-size="13">客户端主动连接握手端口 10010</text>
  <text x="553" y="296" text-anchor="middle" class="note">控制连接用于通知和心跳；断线后重新注册</text>
  <text x="1088" y="324" text-anchor="end" class="note">实线：双向数据转发　虚线：控制连接</text>
</svg>
