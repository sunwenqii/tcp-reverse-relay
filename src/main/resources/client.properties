# \u5BA2\u6237\u7AEF\u9ED8\u8BA4\u914D\u7F6E\u3002\u9996\u6B21\u542F\u52A8\u4F1A\u590D\u5236\u5230\u5F53\u524D\u5DE5\u4F5C\u76EE\u5F55\u7684 config/client.properties\u3002
# \u65E5\u5E38\u4FEE\u6539\u8BF7\u7F16\u8F91 config/client.properties\uFF1B\u7BA1\u7406\u9875\u4E5F\u4F1A\u4FDD\u5B58\u7AEF\u53E3\u53D8\u66F4\u5230\u8BE5\u6587\u4EF6\u3002
mode=simple
# \u9009\u62E9 mode=simple \u65F6\u65E0\u9700\u5BC6\u94A5\uFF0C\u4E5F\u6CA1\u6709\u63E1\u624B\u8BA4\u8BC1\u3002
# \u8BF7\u586B\u5165\u4E0E\u670D\u52A1\u7AEF\u5B8C\u5168\u76F8\u540C\u7684\u4E24\u9879\u5BC6\u94A5\uFF1B\u53EA\u7F16\u8F91\u8FD0\u884C\u76EE\u5F55\u7684 config/client.properties\u3002
# AES_KEY \u7528\u4E8E AES \u52A0\u5BC6\uFF0C\u987B\u4E3A 16\u300124 \u6216 32 \u5B57\u8282\u968F\u673A\u5BC6\u94A5\u7684 Base64 \u7F16\u7801\u3002
AES_KEY=
# TOKEN_KEY \u7528\u4E8E\u63A7\u5236\u6D88\u606F\uFF08\u542B\u63E1\u624B\uFF09\u7684 HMAC \u7B7E\u540D\uFF0C\u81F3\u5C11 32 \u4E2A\u5B57\u7B26\u3002
TOKEN_KEY=
# ADMIN_TOKEN 留空时，首次从本机打开管理页设置 8 至 128 位密码。
ADMIN_TOKEN=
admin.public=false
# \u670D\u52A1\u7AEF\u7684 IP \u5730\u5740\u6216\u4E3B\u673A\u540D\uFF1B\u8FDC\u7A0B\u90E8\u7F72\u65F6\u6539\u4E3A\u5B9E\u9645\u5730\u5740\uFF0C\u7136\u540E\u91CD\u542F\u5BA2\u6237\u7AEF\u3002
server.host=127.0.0.1
# \u5FC5\u987B\u4E0E\u670D\u52A1\u7AEF\u7684 handshake.port \u4E00\u81F4\uFF1B\u4FEE\u6539\u540E\u91CD\u542F\u5BA2\u6237\u7AEF\u3002
handshake.port=10010
# 管理页端口；外网访问由管理页开关控制，默认关闭。
admin.port=19091
# \u516C\u7F51\u7AEF\u53E3:\u672C\u673A\u76EE\u6807\u7AEF\u53E3\uFF0C\u591A\u4E2A\u6620\u5C04\u7528\u9017\u53F7\u5206\u9694\uFF1B\u53EF\u7559\u7A7A\u4E3A forwards=\u3002
forwards=18080:8080
