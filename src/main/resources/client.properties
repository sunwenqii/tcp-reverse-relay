# 默认模板；首次启动复制到当前工作目录的 config/client.properties。
# 只在运行目录的配置里填写真实密钥，不要把密钥提交到 Git。
mode=simple
AES_KEY=
TOKEN_KEY=
# 管理页密码与 TOKEN_KEY 无关；可留空，首次从本机访问时设置。
ADMIN_TOKEN=
admin.public=false
# 服务器地址和握手端口可在客户端管理页“连接设置”中修改，保存后自动重连。
server.host=127.0.0.1
handshake.port=10010
admin.port=19091
# 首次读取自动生成固定标识和机器名。复制给另一台机器时清空 client.id。
client.id=
client.name=
# 兼容 公网端口:本机端口；也支持 公网端口:目标地址:目标端口。
# 例如 18080:192.168.1.20:8080 或 18080:[::1]:8080；多个条目用逗号分隔。
forwards=18080:8080
# 暂停的公网端口，配置保留；启用后自动重新注册。
disabled.forwards=
# 定期连接目标端口后立即关闭，不发送业务数据；不代表应用响应正常。
# 管理页“目标检查”中修改会自动保存并立即生效。
health.enabled=true
# 检查间隔 3–3600 秒；任务繁忙时实际间隔可能延长。
health.interval.seconds=15
# 单次连接及域名解析等待时间；200–10000 毫秒。
health.timeout.millis=2000
# 连续失败 1–10 次判为不可达，一次成功恢复为可达。
health.failure.threshold=2
