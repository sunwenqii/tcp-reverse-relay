# 默认模板；首次启动复制到当前工作目录的 config/client.properties。
# 只在运行目录的配置里填写真实密钥，不要把密钥提交到 Git。
mode=simple
AES_KEY=
TOKEN_KEY=
# 管理页密码与 TOKEN_KEY 无关；可留空，首次从本机访问时设置。
ADMIN_TOKEN=
admin.public=false
server.host=127.0.0.1
handshake.port=10010
admin.port=19091
# 首次读取自动生成固定标识和机器名。复制给另一台机器时清空 client.id。
client.id=
client.name=
# 兼容 公网端口:本机端口；也支持 公网端口:目标地址:目标端口。
# 例如 18080:192.168.1.20:8080 或 18080:[::1]:8080；多个条目用逗号分隔。
forwards=18080:8080
# 暂停的公网端口，配置保留；启用后自动重新注册。
disabled.forwards=
