# 默认模板；首次启动复制到当前工作目录的 config/server.properties。
# 日常修改运行目录下的文件，管理页的修改也会保存到那里。
# simple 无握手认证；公网使用建议两端都改为 secretAll 并填写相同通信密钥。
mode=simple
# AES_KEY 是随机密钥的 Base64 编码，解码后为 16、24 或 32 字节。
AES_KEY=
# TOKEN_KEY 用于控制消息签名，两端相同，至少 32 个字符。
TOKEN_KEY=
# 管理页密码，两端可以不同；留空时首次从本机访问设置，长度 8 至 128。
ADMIN_TOKEN=
admin.public=false
handshake.port=10010
admin.port=19090
# 支持单端口和区间；10000-12000 代表 10000 至 11999，共 2000 个。
# 不能与握手、管理端口冲突；最多 4096 个。启用端口会实际绑定监听。
forwards=18080
# 暂停的端口必须已出现在 forwards 中；暂停保留配置并释放监听。
disabled.forwards=
# 首次注册自动记录端口归属，重启、暂停后仍保留；也可提前指定 client.id。
# 例如 port.owners=18080:office-pc,20000:home-nas；管理页“归属”可转移或释放。
port.owners=
